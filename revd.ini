; revd.asi - more engine audio slots for GTA IV: The Complete Edition (1.2.0.59)
; Log: revd.log next to the .asi.

[revd]
; How many engine audio slots the game may use. Stock 25, maximum 64, 0 leaves the game alone.
;
; GTA IV plays one looping engine sound per distinct vehicle MODEL in earshot and has a fixed table of
; slots to hold them. Past the twenty fifth model, cars are simply silent. Raising this relocates the
; table and lifts the probe bound.
;
; YOU MUST ALSO EDIT pc/audio/config/waveslots.xml so it defines STREAM_ENGINE_1..Slots contiguously.
; The game probes for those slots by name, so one this file does not define stays empty and raising
; the number here buys nothing. See README.md.
Slots = 64

; Physical audio heap, in megabytes. Stock 126, 0 leaves the game alone.
;
; The slot block is carved out of this heap at about 0.8 MB per slot. Past roughly thirty slots the
; stock heap runs out and the game crashes during audio init, so this is not optional when Slots is
; raised. 192 comfortably covers 64 slots. If you set this back to 0, put Slots back to 25.
AudioHeapMB = 192
